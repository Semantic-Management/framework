name: reference-checks
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # smf.py documents "Python 3.9+"; test the oldest and the newest we use.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r reference/tools/requirements.txt
      - name: Validate examples
        run: |
          python reference/tools/smf.py validate reference/examples/gross-margin --strict
          python reference/tools/smf.py validate reference/examples/northwind --strict
      - name: Run checks against the reference resolver
        run: |
          python reference/tools/smf.py test reference/examples/gross-margin
          python reference/tools/smf.py test reference/examples/northwind
      - name: Check Markdown links
        run: python reference/tools/check-links.py
      - name: Build the website (strict, no deploy)
        if: matrix.python-version == '3.12'
        run: |
          pip install -r site/requirements.txt
          python site/build.py
          mkdocs build --strict
