smf: "0.1"
kind: TestCase
id: test.gm.leadership_asks
type: ambiguity
description: In a cross-functional meeting, two things are true; the answer must be a question.
input: { term: gross margin, context: { audience: leadership } }
expected: { state: NEEDS_CLARIFICATION, options: [finance.consolidated_gross_margin, product.gross_margin, services.gross_margin] }
severity: critical
