smf: "0.1"
kind: Concept
id: concept.gross_margin
name: Gross Margin
definition: The share of revenue remaining after the direct cost of delivering what was sold.
status: standard
---
smf: "0.1"
kind: Perspective
id: perspective.gross_margin.product
concept_ref: concept.gross_margin
name: Product Gross Margin
description: Margin on physical goods sold. Direct cost is the landed cost of goods.
owner: Product Line Lead
applies_when: { business_area: product }
status: standard
---
smf: "0.1"
kind: Perspective
id: perspective.gross_margin.service
concept_ref: concept.gross_margin
name: Service Gross Margin
description: Margin on installation and maintenance work. Direct cost is delivery labor, subcontractors and parts used.
owner: Services Lead
applies_when: { business_area: services }
status: standard
---
smf: "0.1"
kind: Perspective
id: perspective.gross_margin.consolidated
concept_ref: concept.gross_margin
name: Consolidated Gross Margin
description: Company-wide margin as reported in the financial statements. Covers all revenue and all cost of revenue.
owner: Controller
applies_when: { audience: board }
enterprise_default: true
broader_than: [perspective.gross_margin.product, perspective.gross_margin.service]
status: standard
---
